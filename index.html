<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boring 14">
<meta name="description" content="A private 14-day habit challenge. Seven plain habits, one tape measure.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Boring 14</title>
<style>
/* --h è la tinta del giorno: colora l'alone dello sfondo e gli accenti. */
@property --h { syntax: '<number>'; inherits: true; initial-value: 40; }
:root{
  --h:40;
  --ink:oklch(0.27 0.01 270);
  --muted:oklch(0.55 0.01 270);
  --card:oklch(0.962 0.003 270);
  --white:oklch(0.995 0.002 270);
  --line:oklch(0.9 0.004 270);
  --glow:oklch(0.68 0.21 var(--h));
  --accent:oklch(0.6 0.2 var(--h));
  --good:oklch(0.64 0.17 150);
  --warn:oklch(0.63 0.2 30);
  --ease:cubic-bezier(.16,1,.3,1);
  transition:--h 1s var(--ease);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);background:var(--white);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{background:transparent}
/* alone caldo nell'angolo, fisso anche su iOS */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 85% at 100% 78%, var(--glow) 0%, oklch(0.76 0.18 var(--h) / .85) 22%, oklch(0.88 0.1 var(--h) / .6) 45%, transparent 70%),
    radial-gradient(60% 40% at -10% 0%, oklch(0.97 0.03 calc(var(--h) + 40)) 0%, transparent 70%),
    var(--white)}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:focus{outline:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 112px);max-width:520px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.grow{flex:1;min-width:0}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.enter > *{animation:rise .6s var(--ease) both}
.enter > *:nth-child(2){animation-delay:.05s}.enter > *:nth-child(3){animation-delay:.1s}
.enter > *:nth-child(4){animation-delay:.15s}.enter > *:nth-child(5){animation-delay:.2s}.enter > *:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* la scheda dello stile: grigio chiaro, bordo bianco spesso, ombra colorata morbida */
.card{background:var(--card);border:5px solid oklch(1 0 0 / .8);border-radius:30px;padding:12px;margin-bottom:12px;
  box-shadow:0 12px 32px oklch(0.55 0.14 var(--h) / .16),0 2px 6px oklch(0.3 0.02 270 / .05)}
button.card{display:block;width:100%;text-align:left;transition:transform .25s var(--ease)}
button.card:active{transform:scale(.97)}
.tile{width:60px;height:60px;border-radius:20px;background:var(--white);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px oklch(0.3 0.02 270 / .06)}
.tile svg{width:26px;height:26px;stroke:var(--c);stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tile.fill svg{fill:var(--c);stroke:none}
.metric{display:flex;align-items:center;gap:14px}
.metric .lbl{font-weight:700;font-size:15px}
.metric .val{font-size:30px;line-height:1.1;margin-top:2px}
.metric .val small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.spark{width:112px;height:58px;flex:none;overflow:visible}
.enter .spark .ln{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.4s var(--ease) .2s forwards}
.enter .spark .ar{opacity:0;animation:fade .8s ease .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

.bar-top{display:flex;align-items:center;gap:12px;min-height:46px;margin-bottom:6px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:4px solid oklch(1 0 0 / .8);box-shadow:0 6px 16px oklch(0.55 0.14 var(--h) / .18);flex:none}

/* hero */
.hero{padding:18px 18px 16px}
.hero .big{font-size:96px;line-height:.85;letter-spacing:-.05em;margin:6px 0 0 -3px}
.hero .big small{font-size:24px;color:var(--muted);letter-spacing:-.01em;margin-left:4px}
.hero .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px}
.hero .cheer{font-weight:700;font-size:16px;max-width:60%}
.hero .pct{text-align:right;font-size:13px;color:var(--muted)}
.hero .pct b{display:block;font-size:30px;color:var(--accent)}
.journey{display:flex;gap:4px;margin-top:14px}
.journey button{flex:1;height:28px;border-radius:9px;position:relative;background:var(--white);overflow:hidden}
.journey button i{position:absolute;inset:auto 0 0 0;background:oklch(0.66 0.19 var(--dh));transition:height .9s var(--ease)}
.journey button.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.journey button:disabled{opacity:.55}

.section{display:flex;align-items:baseline;margin:22px 4px 10px}
.section h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.section span{margin-left:auto}

/* abitudini */
.habit{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.habit .tile{width:50px;height:50px;border-radius:17px}
.habit .tile svg{width:23px;height:23px}
.habit .t{font-weight:700;font-size:16px}
.habit .s{font-size:13px;color:var(--muted);margin-top:1px}
.card.habit-card{padding:8px 12px 8px 8px;margin-bottom:10px}
.ck{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line);background:var(--white);display:grid;place-items:center;flex:none;transition:background .35s var(--ease),border-color .35s}
.ck svg{width:16px;height:16px;stroke:var(--white);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .05s}
.done .ck{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.done .ck svg{stroke-dashoffset:0}
.habit-card.done .t{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--c);color:var(--muted)}
.pop .ck{animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.55)}}

.note{display:flex;gap:12px;align-items:flex-start}
.note .tile{width:44px;height:44px;border-radius:15px}

.chips{display:flex;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:40px;background:var(--white);font-weight:700;font-size:14px}
.chip.solid{background:var(--ink);color:var(--white)}

/* righe dentro le schede */
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 10px;border-bottom:1.5px solid var(--white)}
.row:last-child{border-bottom:0}
.row:disabled{opacity:.5}
.row .t{font-weight:700}
.row .s{font-size:13px;color:var(--muted)}
.row select{appearance:none;-webkit-appearance:none;border:0;background:var(--white);padding:8px 12px;border-radius:12px;font-weight:700}
.card.list{padding:4px 6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .card{margin:0}
.mini .val{font-size:26px}

/* circuito */
.seg{display:flex;background:var(--card);border:4px solid oklch(1 0 0 / .8);border-radius:40px;padding:3px;margin:4px 0 14px;box-shadow:0 8px 20px oklch(0.55 0.14 var(--h) / .12)}
.seg button{flex:1;padding:10px 4px;border-radius:30px;font-weight:700;font-size:14px;color:var(--muted);transition:background .3s var(--ease),color .3s}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 2px 6px oklch(0.3 0.02 270 / .08)}
.ex{padding:8px}
.ex-head{display:flex;align-items:center;gap:12px}
.ex-open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.ex .tile{width:50px;height:50px;border-radius:17px;font-weight:800;font-size:20px;color:var(--c)}
.ex .t{font-weight:700}
.ex .chev{transition:transform .35s var(--ease);color:var(--muted)}
.ex.open .chev{transform:rotate(90deg)}
.ex-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.ex.open .ex-body{grid-template-rows:1fr}
.ex-body > div{overflow:hidden}
.ex-inner{padding:12px 6px 6px}
.fig-wrap{background:var(--white);border-radius:22px;padding:10px 12px 4px}
.fig{width:100%;height:auto;display:block}
.fig line{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.fig line.back{stroke:oklch(0.27 0.01 270 / .3)}
.fig .head{fill:var(--ink)}
.fig .floor{stroke:var(--line);stroke-width:2}
.fig .prop{stroke:var(--muted);stroke-width:4}
.fig .propdot{fill:var(--muted)}
.fig .towel{stroke:var(--c);stroke-width:3;stroke-dasharray:4 3}
.ex ol{margin:12px 0 8px;padding-left:22px}
.ex li{margin-bottom:6px}
.ex .links{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex a{color:var(--c);font-weight:700;text-decoration:none;font-size:14px;white-space:nowrap}

/* progressi */
.bars{position:relative;display:flex;align-items:flex-end;gap:5px;height:170px;margin-top:12px}
.bars .b{flex:1;border-radius:8px;height:3%;background:linear-gradient(to top,oklch(0.66 0.19 var(--dh) / .25),oklch(0.66 0.19 var(--dh)));transition:height 1s var(--ease)}
.bars .b.future{background:var(--white)}
.bars .b.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.avg{position:absolute;left:0;right:0;bottom:0;border-top:2px dashed var(--ink);transition:bottom 1s var(--ease)}
.avg b{position:absolute;right:0;top:-26px;background:var(--ink);color:var(--white);font-size:11px;padding:3px 8px;border-radius:8px}
.xl{display:flex;gap:5px;margin-top:8px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.xl span.on{color:var(--ink);font-weight:800}

/* cibo */
.plate{width:100%;max-width:290px;display:block;margin:0 auto}
.plate .rim{fill:var(--white);stroke:var(--line);stroke-width:2}
.plate .sl{transform-origin:100px 105px;transform-box:view-box;stroke:var(--white);stroke-width:3;animation:slice .8s var(--ease) both}
.plate .s2{animation-delay:.12s}.plate .s3{animation-delay:.24s}.plate .s4{transform-origin:190px 34px;animation-delay:.4s}
@keyframes slice{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.plate text{font-size:12px;font-weight:800;fill:var(--ink)}

.btn{display:block;width:100%;padding:17px;border-radius:40px;background:var(--ink);color:var(--white);font-weight:800;font-size:17px;text-align:center;transition:transform .2s var(--ease),opacity .3s;box-shadow:0 10px 24px oklch(0.3 0.02 270 / .2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;box-shadow:none}
.btn.ghost{background:var(--white);color:var(--ink);box-shadow:none;border:4px solid oklch(1 0 0 / .8)}

/* nav */
nav{position:fixed;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:484px;margin:0 auto;display:flex;gap:4px;background:var(--card);border:5px solid oklch(1 0 0 / .85);padding:4px;border-radius:40px;box-shadow:0 14px 34px oklch(0.5 0.14 var(--h) / .25)}
nav[hidden]{display:none}
nav button{height:52px;flex:1;border-radius:30px;display:grid;place-items:center;color:var(--muted);transition:background .35s var(--ease),color .35s}
nav button.on{background:var(--white);color:var(--accent);box-shadow:0 2px 8px oklch(0.3 0.02 270 / .08)}

/* tour */
.tour{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 18px);overflow:hidden}
.tour-top{display:flex;justify-content:space-between;align-items:center}
.lang{display:flex;background:var(--card);border:4px solid oklch(1 0 0 / .8);border-radius:30px;padding:2px}
.lang button{padding:6px 12px;border-radius:24px;font-size:13px;font-weight:800;color:var(--muted)}
.lang button.on{background:var(--white);color:var(--ink)}
.slides{flex:1;display:flex;transition:transform .7s var(--ease);margin:0 -22px}
.slide{flex:0 0 100%;padding:0 22px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.slide h1{font-size:38px;line-height:1.04;letter-spacing:-.03em}
.slide p.lead{font-size:17px;margin:12px 0 0;max-width:32ch;color:var(--muted)}
.art{min-height:230px;display:grid;place-items:center;margin-bottom:10px;position:relative}
.slide:not(.play) .art *{animation:none!important}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:7px;height:7px;border-radius:7px;background:oklch(0.27 0.01 270 / .2);transition:width .5s var(--ease),background .5s}
.dots i.on{width:22px;background:var(--ink)}
.orbit{position:relative;width:220px;height:220px}
.orbit i{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border-radius:50%;background:oklch(0.66 0.19 var(--dh));border:3px solid var(--white);transform:rotate(var(--a)) translateY(-96px) scale(0);animation:orb .9s var(--ease) forwards;animation-delay:calc(var(--i) * 60ms)}
@keyframes orb{to{transform:rotate(var(--a)) translateY(-96px) scale(1)}}
.orbit .num{position:absolute;inset:0;display:grid;place-items:center;font-size:92px}
.stack{display:flex;flex-direction:column;gap:7px;width:260px}
.stack div{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid oklch(1 0 0 / .8);border-radius:18px;padding:6px 10px 6px 6px;font-weight:700;font-size:14px;opacity:0;transform:translateY(16px);animation:rise2 .7s var(--ease) forwards;animation-delay:calc(var(--i) * 90ms + .1s);box-shadow:0 6px 14px oklch(0.55 0.14 var(--h) / .12)}
.stack .tile{width:34px;height:34px;border-radius:12px}
.stack .tile svg{width:18px;height:18px}
@keyframes rise2{to{opacity:1;transform:none}}
.lock path,.lock rect{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.4s var(--ease) forwards}
.lock rect{animation-delay:.2s}
.phone{width:132px;height:220px;border-radius:30px;border:6px solid var(--ink);position:relative;background:var(--card)}
.phone::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:10px;margin-left:-20px;border-radius:10px;background:var(--ink)}
.phone .bar{position:absolute;left:8px;right:8px;bottom:10px;height:30px;border-radius:12px;background:var(--white);display:flex;justify-content:space-around;align-items:center}
.phone .bar span{width:8px;height:8px;border-radius:3px;background:var(--line)}
.phone .share{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--white);display:grid;place-items:center;animation:pulse 1.6s var(--ease) infinite}
.phone .share svg{width:18px;height:18px}
.phone .tile{position:absolute;top:44px;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:14px;opacity:0;animation:land 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 oklch(0.6 0.2 var(--h) / .5)}60%{box-shadow:0 0 0 12px oklch(0.6 0.2 var(--h) / 0)}}
@keyframes land{0%,40%{opacity:0;transform:translateY(80px) scale(.6)}70%,100%{opacity:1;transform:none}}
.steps-list{list-style:none;padding:0;margin:16px 0 0;counter-reset:s}
.steps-list li{counter-increment:s;display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:15px}
.steps-list li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.opts{display:flex;gap:8px;margin:10px 0}
.opt{flex:1;padding:12px 6px;border-radius:18px;font-weight:800;font-size:14px;text-align:center;background:var(--card);border:3px solid oklch(1 0 0 / .8)}
.opt.on{background:var(--ink);color:var(--white);border-color:var(--ink)}

input{width:100%;font-size:22px;font-weight:800;background:var(--white);border:4px solid oklch(1 0 0 / .8);border-radius:20px;padding:13px 16px;outline:none;color:var(--ink);box-shadow:0 6px 16px oklch(0.55 0.14 var(--h) / .12)}
input:focus{border-color:var(--accent)}
input[type=date]{font-size:17px;min-height:56px}

dialog{border:0;border-radius:30px;background:var(--card);color:var(--ink);width:min(92vw,400px);padding:22px;box-shadow:0 20px 60px oklch(0.3 0.05 var(--h) / .25)}
dialog[open]{animation:rise .4s var(--ease)}
dialog::backdrop{background:oklch(0.3 0.03 var(--h) / .3)}
dialog h3{margin:0 0 14px;font-size:20px}
.dlg-row{display:flex;flex-direction:row-reverse;gap:10px;margin-top:16px}
.dlg-row button{flex:1;padding:14px;border-radius:30px;background:var(--white);font-weight:800}
.dlg-row button.primary{background:var(--ink);color:var(--white)}
.guide h3{font-size:17px;margin:18px 0 6px}
.guide ol{padding-left:20px;margin:6px 0}
.guide li{margin-bottom:8px}
.guide b{font-weight:800;color:var(--accent)}

.countdown{text-align:center;padding:24px 0 10px}
.countdown .big{font-size:150px;line-height:.9;color:var(--accent)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:30px;font-weight:800;transition:transform .5s var(--ease);z-index:10;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*,:root{animation:none!important;transition:none!important}.orbit i{transform:rotate(var(--a)) translateY(-96px)}.stack div{opacity:1;transform:none}.spark .ln{stroke-dashoffset:0}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden></nav>
<div id="toast" role="status"></div>
<canvas id="confetti"></canvas>
<dialog id="ask">
  <form method="dialog">
    <h3 id="askTitle"></h3>
    <input id="askInput" inputmode="decimal" autocomplete="off">
    <div class="dlg-row"><button value="ok" class="primary" id="askOk"></button><button value="cancel" formnovalidate id="askNo"></button></div>
  </form>
</dialog>
<dialog id="confirm">
  <form method="dialog">
    <h3 id="cfT"></h3>
    <p class="muted" id="cfB"></p>
    <div class="dlg-row"><button value="ok" id="cfOk" style="background:var(--warn);color:var(--white)"></button><button value="cancel" id="cfNo"></button></div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
