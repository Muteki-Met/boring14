<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAFD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boring 14">
<meta name="description" content="A private 14-day habit challenge. Seven plain habits, one tape measure.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Boring 14</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden></nav>
<div id="toast" role="status"></div>
<canvas id="confetti"></canvas>
<dialog id="ask">
  <form method="dialog">
    <h3 id="askTitle"></h3>
    <input id="askInput" inputmode="decimal" autocomplete="off">
    <div class="dlg-row"><button value="ok" class="primary" id="askOk"></button><button value="cancel" formnovalidate id="askNo"></button></div>
  </form>
</dialog>
<dialog id="confirm">
  <form method="dialog">
    <h3 id="cfT"></h3>
    <p class="muted" id="cfB"></p>
    <div class="dlg-row"><button value="ok" id="cfOk" style="background:var(--warn);color:var(--white)"></button><button value="cancel" id="cfNo"></button></div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
